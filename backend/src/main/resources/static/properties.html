<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Properties - RealEstateHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>

    <!-- Dynamic Navbar -->
    <div id="navbarPlaceholder"></div>

    <!-- Header Banner -->
    <div class="bg-dark text-white py-4 mb-4">
        <div class="container">
            <h2 class="fw-bold mb-1">Explore Properties</h2>
            <p class="text-light opacity-75 mb-0">Search, filter, and discover homes, villas, apartments, and commercial spaces.</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mb-5">
        <div class="row g-4">
            <!-- Filter Sidebar -->
            <div class="col-lg-3">
                <div class="card border shadow-sm p-3 sticky-top" style="top: 20px; z-index: 10;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0"><i class="bi bi-funnel-fill text-primary me-2"></i>Filters</h5>
                        <button class="btn btn-link btn-sm text-decoration-none text-muted p-0" id="resetFiltersBtn">Reset</button>
                    </div>

                    <form id="filterForm">
                        <!-- City / Keyword Search -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">City / Location</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-geo-alt"></i></span>
                                <input type="text" class="form-control" id="filterCity" placeholder="City or location...">
                            </div>
                        </div>

                        <!-- Listing Type (Sale vs Rent) -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Listing Type</label>
                            <select class="form-select" id="filterListingType">
                                <option value="">All (Sale & Rent)</option>
                                <option value="SALE">For Sale</option>
                                <option value="RENT">For Rent</option>
                            </select>
                        </div>

                        <!-- Property Type -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Property Type</label>
                            <select class="form-select" id="filterPropertyType">
                                <option value="">All Types</option>
                                <option value="APARTMENT">Apartment</option>
                                <option value="HOUSE">House</option>
                                <option value="VILLA">Villa</option>
                                <option value="COMMERCIAL">Commercial</option>
                                <option value="PLOT">Plot / Land</option>
                            </select>
                        </div>

                        <!-- Price Range -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Price Range ($)</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <input type="number" class="form-control form-control-sm" id="filterMinPrice" placeholder="Min Price" min="0">
                                </div>
                                <div class="col-6">
                                    <input type="number" class="form-control form-control-sm" id="filterMaxPrice" placeholder="Max Price" min="0">
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-search me-1"></i>Apply Filters
                        </button>
                    </form>
                </div>
            </div>

            <!-- Properties Grid -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <span class="fw-bold" id="resultsCount">Loading listings...</span>
                    </div>
                </div>

                <div class="row g-4" id="propertiesGrid">
                    <!-- Dynamic cards inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container text-center small text-muted">
            &copy; 2026 RealEstateHub. All rights reserved.
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/properties.js"></script>
</body>
</html>
